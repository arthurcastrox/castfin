<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}CastFin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topo">
    <a class="logo" href="{{ url_for('dashboard') }}">Cast<span>Fin</span></a>
    <a class="btn" href="{{ url_for('novo_lancamento') }}">+ Novo lançamento</a>
  </header>

  <main class="container">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for tipo, texto in mensagens %}
        <div class="aviso {{ tipo }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
